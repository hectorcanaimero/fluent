name: CI

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
      interview_agent: ${{ steps.filter.outputs.interview_agent }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'testdata/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'apps/mobile/**'
              - '.github/workflows/ci.yml'
            interview_agent:
              - 'apps/interview-agent/**'
              - 'testdata/**'
              - '.github/workflows/ci.yml'

  api:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.api == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @fluent/api lint

      - name: Test
        run: pnpm --filter @fluent/api test

      - name: Build
        run: pnpm --filter @fluent/api build

      - name: Audit dependencies
        run: pnpm audit --audit-level high

  mobile:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Run Flutter analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: apps/mobile
        run: flutter test

  interview-agent:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.interview_agent == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          working-directory: apps/interview-agent
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: apps/interview-agent/uv.lock

      - name: Install dependencies
        working-directory: apps/interview-agent
        run: uv sync --frozen

      - name: Lint
        working-directory: apps/interview-agent
        run: uv run ruff check .

      - name: Test
        working-directory: apps/interview-agent
        run: uv run pytest
