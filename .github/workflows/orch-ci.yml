# Generated by `orch ci setup` from this repository's files. Safe to edit:
# orch never overwrites it unless asked to (--force).
#
# Runs on every pull request, which is what orch's auto-PR loop waits on
# (config.yaml `vcs:`), and on pushes to the base branch.
name: orch-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    name: node (pnpm)
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build
