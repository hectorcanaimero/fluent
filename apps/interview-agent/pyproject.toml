[project]
name = "interview-agent"
version = "0.1.0"
description = "Servicio de preparación y parecer de entrevistas (Fluent, F10)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118,<1",
  "uvicorn[standard]>=0.38,<1",
  "agno>=3.1,<4",
  "openai>=2,<3",
  "httpx>=0.28,<1",
  "ddgs>=9.16,<10",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "httpx>=0.28,<1",
  "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = ["live: llama a 9router y DuckDuckGo de verdad (no corre en CI; `pytest -m live`)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
