name: fluent_mobile
description: "Fluent — práctica de inglés conversacional por voz."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Estado
  flutter_riverpod: ^2.6.1

  # Navegación
  go_router: ^15.1.2

  # HTTP
  dio: ^5.7.0

  # Modelos inmutables
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Almacenamiento seguro
  flutter_secure_storage: ^9.2.2

  # Voz
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # PKCE / navegador externo
  flutter_web_auth_2: ^4.1.0

  # Compartir
  share_plus: ^10.1.4

  # Recordatorios locales
  flutter_local_notifications: ^18.0.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1

  mocktail: ^1.0.4
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  generate: true
