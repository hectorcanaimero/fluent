name: fluent_mobile
description: "Fluent — práctica de inglés conversacional por voz."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Estado
  flutter_riverpod: ^2.6.1

  # Navegación
  go_router: ^15.1.2

  # HTTP
  dio: ^5.7.0

  # Modelos inmutables
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Almacenamiento seguro
  flutter_secure_storage: ^9.2.2

  # Preferencias locales (no sensibles): horarios de recordatorios, flags
  # de "ya se preguntó esto" (MAL-10, MAL-24, MAL-28).
  shared_preferences: ^2.3.2

  # Voz
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  permission_handler: ^11.3.1

  # PKCE / navegador externo
  flutter_web_auth_2: ^4.1.0
  url_launcher: ^6.3.2

  # Compartir
  share_plus: ^10.1.4

  # Recordatorios locales
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  flutter_timezone: ^4.1.0

  cupertino_icons: ^1.0.8
  lottie: ^3.6.1
  crypto: ^3.0.7
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  firebase_messaging: ^16.7.0
  purchases_flutter: ^10.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1

  mocktail: ^1.0.4
  http_mock_adapter: ^0.6.1
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FDF4EC"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  web:
    generate: true
    background_color: "#FDF4EC"
    theme_color: "#0E9C8C"

# Mismo fondo que `AppColors.bg` y que el splash animado, para que el paso
# del splash del sistema a Flutter no se note. Regenerar con:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FAF8F4"
  # Android 12+ siempre dibuja un ícono en su splash; uno transparente evita
  # que se vea el logo dos veces (el del sistema y el de la animación Lottie).
  android_12:
    color: "#FAF8F4"
    image: assets/icon/splash_blank.png
  web: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL.txt
    - assets/animations/splash.json
    - assets/auth/google_g.png
    - assets/icon/icon.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
