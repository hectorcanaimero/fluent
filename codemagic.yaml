# Codemagic: builds de release de la app móvil (apps/mobile) para Google
# Play y App Store. Se disparan con un tag `v*` (por ejemplo v1.0.0) o a
# mano desde Codemagic. La configuración de la cuenta (grupo de variables,
# keystore, integración con App Store Connect) está en
# docs/runbooks/stores.md.

definitions:
  android_versions: &android_versions
    flutter: stable
  ios_versions: &ios_versions
    flutter: stable
    xcode: latest

  triggering: &triggering
    events:
      - tag
    tag_patterns:
      - pattern: "v*"
        include: true

  cache: &cache
    cache_paths:
      - $HOME/.pub-cache
      - $HOME/.gradle/caches

  scripts:
    # Los archivos de Firebase: si no están en el repo, salen de variables
    # (base64) del grupo `fluent_prod`.
    - &firebase_config
      name: Archivos de Firebase
      script: |
        if [ ! -f android/app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
        fi
        if [ ! -f ios/Runner/GoogleService-Info.plist ] && [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
        fi
    - &pub_get
      name: Dependencias
      script: flutter pub get
    - &tests
      name: Análisis y tests
      script: |
        flutter analyze
        flutter test
    # Variables de producción, siempre del grupo `fluent_prod` (nunca de
    # defines.json). La versión visible sale de `version:` en pubspec.yaml.
    - &release_defines
      name: Defines de producción y versión
      script: |
        for var in API_URL INSFORGE_URL INSFORGE_ANON_KEY; do
          if [ -z "${!var}" ]; then echo "Falta $var en el grupo fluent_prod"; exit 1; fi
        done
        echo "DART_DEFINES=--dart-define=API_URL=$API_URL --dart-define=INSFORGE_URL=$INSFORGE_URL --dart-define=INSFORGE_ANON_KEY=$INSFORGE_ANON_KEY --dart-define=USE_FAKE_API=false" >> $CM_ENV
        echo "BUILD_NAME=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')" >> $CM_ENV

workflows:
  android-release:
    name: Android · Google Play (internal)
    # El plan gratuito solo da la Mac mini M2; `linux_x2` es de pago. El AAB
    # se compila igual en macOS.
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/mobile
    triggering: *triggering
    cache: *cache
    environment:
      <<: *android_versions
      groups:
        - fluent_prod
      vars:
        PACKAGE_NAME: com.guria.openfluent
        GOOGLE_PLAY_TRACK: internal
    scripts:
      - *firebase_config
      # El keystore viene del grupo de variables (ANDROID_KEYSTORE_B64), no de
      # "Code signing identities": así la firma no depende de dónde esté
      # cargado el keystore en la cuenta. `build.gradle.kts` lee las CM_*.
      - name: Keystore de firma
        script: |
          for var in ANDROID_KEYSTORE_B64 CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then echo "Falta $var en el grupo fluent_prod"; exit 1; fi
          done
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$CM_BUILD_DIR/upload-keystore.jks"
          echo "CM_KEYSTORE_PATH=$CM_BUILD_DIR/upload-keystore.jks" >> $CM_ENV
      - *pub_get
      - *tests
      - *release_defines
      - name: Build del AAB
        script: |
          # versionCode: uno más que el último subido a Play; si todavía no
          # hay ninguno (o falla la consulta), el contador de Codemagic.
          LATEST=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" 2>/dev/null || echo "")
          if [ -n "$LATEST" ]; then NEXT=$((LATEST + 1)); else NEXT=$BUILD_NUMBER; fi
          flutter build appbundle --release \
            --build-name="$BUILD_NAME" \
            --build-number="$NEXT" \
            $DART_DEFINES
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal

  ios-release:
    name: iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    working_directory: apps/mobile
    triggering: *triggering
    cache: *cache
    integrations:
      # Clave de la API de App Store Connect, cargada como integración del
      # equipo con este nombre.
      app_store_connect: Open Fluent ASC
    environment:
      <<: *ios_versions
      groups:
        - fluent_prod
      vars:
        BUNDLE_ID: com.guria.openfluent
    scripts:
      - *firebase_config
      # El proyecto usa Swift Package Manager (no hay Podfile): nada de
      # `pod install`.
      - name: Swift Package Manager
        script: flutter config --enable-swift-package-manager
      - *pub_get
      - *tests
      - *release_defines
      # La firma automática de Codemagic solo *busca* los archivos; si el
      # perfil todavía no existe, falla con "No matching profiles found".
      # `--create` lo genera (y el certificado de distribución) con la clave
      # de la integración.
      - name: Certificado y perfil de firma
        script: |
          keychain initialize
          # Los perfiles viejos se reutilizan tal cual: uno creado antes de
          # activar Push Notifications hace fallar el archive con
          # «requires a provisioning profile with the Push Notifications
          # feature». Se borran para que se regeneren con las capacidades
          # actuales del identificador.
          for id in $(app-store-connect list-profiles \
                        --bundle-id-identifier "$BUNDLE_ID" \
                        --profile-type IOS_APP_STORE --json 2>/dev/null \
                      | jq -r '.[].id' || true); do
            app-store-connect delete-profile "$id" --ignore-not-found || true
          done
          # Sin `--certificate-key` el comando avisa «Cannot save Signing
          # Certificates without certificate private key» y no deja ni
          # certificado ni perfil: el archive falla después quejándose de la
          # primera capacidad que encuentra en los entitlements. La clave es
          # una RSA propia guardada en el grupo de variables; con `--create`
          # se emite el certificado de distribución contra ella.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles
          # Sin perfil instalado el archive falla igual, pero culpando a la
          # primera capacidad de los entitlements («requires a provisioning
          # profile with the Push Notifications feature»), que manda a
          # investigar el lado equivocado. Se corta acá con el motivo real.
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          if ! ls "$PROFILES"/*.mobileprovision >/dev/null 2>&1; then
            echo "No se instalo ningun perfil de aprovisionamiento."
            echo "Suele ser el certificado: sin CERTIFICATE_PRIVATE_KEY,"
            echo "fetch-signing-files no guarda ni certificado ni perfiles."
            exit 1
          fi
          # Qué entitlements trae el perfil: si no aparece `aps-environment`,
          # la capacidad Push no está guardada en el identificador.
          for profile in "$PROFILES"/*.mobileprovision; do
            echo "== $profile"
            security cms -D -i "$profile" \
              | plutil -extract Entitlements xml1 -o - - || true
          done
      - name: Build del IPA
        script: |
          # Número de build: uno más que el último en TestFlight; si falla la
          # consulta (app nueva), el contador de Codemagic.
          LATEST=""
          if [ -n "$APP_STORE_APPLE_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number \
              "$APP_STORE_APPLE_ID" 2>/dev/null || echo "")
          fi
          if [ -n "$LATEST" ]; then NEXT=$((LATEST + 1)); else NEXT=$BUILD_NUMBER; fi
          # `flutter build ipa` hace su propia comprobación de certificados y
          # falla ("No valid code signing certificates were found") aunque el
          # perfil ya esté instalado. Se compila sin firmar y el IPA lo
          # empaqueta la herramienta de Codemagic con los perfiles que dejó
          # `xcode-project use-profiles`.
          flutter build ios --release --no-codesign \
            --build-name="$BUILD_NAME" \
            --build-number="$NEXT" \
            $DART_DEFINES
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
